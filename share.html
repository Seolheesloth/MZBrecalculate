<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MZB 리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202B; --muted:#66727F; --line:#D6DCE3;
  --buy:#17744E; --buy-soft:#E3F2EA; --sell:#B3362B; --sell-soft:#F7E4E1; --focus:#2D5BD7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171D; --surface:#1A2129; --ink:#E6EBF0; --muted:#8C98A5; --line:#2A333D;
    --buy:#3DBE86; --buy-soft:#15302A; --sell:#F0685B; --sell-soft:#3A1F1D; --focus:#7FA2FF;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 16px}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.ver{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.ver small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.ver-new{border:0;background:var(--buy-soft);color:var(--buy);font:inherit;font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px;cursor:pointer;margin-top:2px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;padding:8px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--surface);font-weight:500}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;
  padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.small{font-size:13px;padding:6px 10px}
.btn:disabled{opacity:.4;cursor:default}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.summary p{margin:0}
.summary .headline{font-size:17px;font-weight:500}
.summary .meta{color:var(--muted);font-size:13px;margin-top:2px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.money div{font-size:12px;color:var(--muted)}
.money strong{display:block;font-size:16px;color:var(--ink);font-weight:500}

/* ticket list */
.group-title{font-size:13px;color:var(--muted);margin:18px 4px 6px;font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ticket{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;padding:12px 14px 12px 8px;border-top:1px solid var(--line)}
.ticket:first-child{border-top:0}
.ticket.done{opacity:.45}
.ticket.done .tk{text-decoration:line-through}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;padding:0;display:grid;place-items:center;color:transparent;justify-self:center}
.ticket.done .check{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tk{font-weight:700;font-size:17px;letter-spacing:.01em}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.tag.new{background:var(--buy-soft);color:var(--buy)}
.tag.out{background:var(--sell-soft);color:var(--sell)}
.detail{font-size:13px;color:var(--muted)}
.delta{text-align:right}
.delta b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.delta.buy b{color:var(--buy)} .delta.sell b{color:var(--sell)}
.delta span{font-size:12px;color:var(--muted)}
.same{padding:10px 14px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
.apply-bar{position:sticky;bottom:12px;margin-top:16px}
.apply-bar .btn{width:100%;padding:14px;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.12)}

/* balance */
.bal{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-4px 2px 14px}
.bal .lbl{font-size:13px;color:var(--muted)}
.bal .v{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.bal .src{font-size:12px;color:var(--muted);text-align:right}
/* position cards */
.list{--c-id:240px;--c-amt:110px;--c-wt:64px}
.pos{display:grid;grid-template-columns:24px var(--c-id) var(--c-amt) var(--c-wt) minmax(80px,1fr) 32px;gap:10px;align-items:center;padding:12px 8px 12px 4px;border-top:1px solid var(--line)}
.pos .amt,.pos .wt{align-self:start;padding-top:4px;text-align:right;font-size:14px}
.pos .wt{font-weight:500}
.pos.head{padding-top:8px;padding-bottom:8px;font-size:12px;color:var(--muted);align-items:end}
.pos.head div{padding-top:0!important;font-weight:400!important}
.pos.head .r{text-align:right}
.pos.head>div{position:relative}
.pos.head .id,.pos.head .amt,.pos.head .wt{overflow:visible!important}
.hs{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:12px;white-space:nowrap}
.hs:hover,.hs[aria-sort]{color:var(--ink)}
.hs:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.hs .arr{font-size:9px;opacity:.4}
.hs[aria-sort] .arr{opacity:1}
.rz{position:absolute;top:-8px;bottom:-8px;right:-11px;width:12px;cursor:col-resize;touch-action:none;z-index:2}
.rz::after{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--line)}
.rz:hover::after,.rz.on::after{background:var(--focus)}
body.resizing{cursor:col-resize;user-select:none}
.pos .id{overflow:hidden}
@media (max-width:480px){
  .pos{grid-template-columns:16px var(--c-id) var(--c-amt) var(--c-wt) minmax(72px,1fr) 26px;gap:6px}
  .pos .amt,.pos .wt{font-size:12px!important}
  .tgt .sh span{display:none}
  .hs .lg{display:none}
  .hs .arr{display:none}
  .hs[aria-sort] .arr{display:inline}
  .pos .id{overflow:hidden}
  .pos .tk{font-size:15px}
  .pos .tag{display:block;width:max-content;margin:2px 0 0}
  .tgt .act small{display:block;margin:0}
  .pos .check{width:24px;height:24px}
  .tgt .sh b{font-size:18px}
}
.pos:first-child{border-top:0}
.pos .no{color:var(--muted);font-size:13px;text-align:right;align-self:start;padding-top:3px}
.pos .id{align-self:start;min-width:0}
.pos .nm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgt{text-align:right;line-height:1.35}
.tgt .sh b{font-size:20px;font-weight:700}
.tgt .sh span{font-size:12px;color:var(--muted);margin-left:3px}
.tgt .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pct{display:inline-block;background:var(--bg);color:var(--ink);font-weight:500;border-radius:4px;padding:0 6px;margin-left:6px}
.tgt .hold{font-size:12px;color:var(--muted);margin-top:2px}
.tgt .act{font-size:17px;font-weight:700;margin-top:2px}
.tgt .act small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.act.buy{color:var(--buy)} .act.sell{color:var(--sell)}
.act.ok{font-size:13px!important;font-weight:400!important;color:var(--muted)}
.pos.same .tgt .sh b{color:var(--muted)}
.pos.done{opacity:.45}
.pos .ck{display:grid;place-items:center}
.pos .check{width:28px;height:28px}
.pos.done .check{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.sortbar{display:flex;align-items:center;gap:4px;margin:16px 2px 8px;font-size:13px;color:var(--muted)}
.sortbar span{margin-right:4px}
.sortbar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;padding:4px 10px;border-radius:6px;cursor:pointer}
.sortbar button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
td.mut{color:var(--muted);font-size:14px}
.tbl table{min-width:440px}
th{white-space:nowrap}
input.q{min-width:76px}
td.mut{white-space:nowrap}

/* tables / forms */
table{width:100%;border-collapse:collapse}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl-scroll{overflow-x:auto}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
input.tick{text-transform:uppercase;font-weight:700;max-width:110px}
input.q{max-width:90px;text-align:right}
td.x{width:36px;text-align:center}
td.no,th.no{width:34px;padding-right:0;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
th button.sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:inherit;font:inherit}
th button.sort:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
th button.sort .arr{font-size:10px;opacity:.35}
th button.sort[aria-sort] .arr{opacity:1;color:var(--ink)}
.xbtn{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
textarea{min-height:180px;resize:vertical;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 4px}
.card p.help{color:var(--muted);font-size:13px;margin:0 0 12px}
label.fld{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.status{font-size:13px;color:var(--muted);margin-top:8px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .help{color:var(--muted);font-size:13px;margin:0 0 12px}
.sheet .foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sheet .foot .btn{flex:1}
.hist li{font-size:14px;margin:6px 0}
.hist{padding-left:18px;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.hidden{display:none!important}

.list{--c-id:190px;--c-amt:92px;--c-wt:96px}
@media (max-width:480px){.list{--c-id:72px;--c-amt:62px;--c-wt:58px}}
.tgt,.tgt .act,.tgt .sh,.tgt .hold{white-space:nowrap}
.pos{grid-template-columns:24px var(--c-id) var(--c-amt) var(--c-wt) minmax(100px,1fr) 32px}
@media (max-width:480px){.pos{grid-template-columns:16px var(--c-id) var(--c-amt) var(--c-wt) minmax(86px,1fr) 26px}}
.notice{background:var(--buy-soft);color:var(--buy);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MZB 리스트</h1>
    <div class="hdr-r"><span class="ver" id="verTag"></span><span class="sub" id="buildTag"></span><span class="sub" id="syncState"></span></div>
  </header>
  <div id="errBox" class="hidden" style="background:var(--sell-soft);color:var(--sell);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;word-break:break-all"></div>
  <nav role="tablist" id="tabs" class="hidden">
    <button role="tab" data-tab="trade" aria-selected="true">조정</button>
    <button role="tab" data-tab="hold" aria-selected="false">보유</button>
    <button role="tab" data-tab="set" aria-selected="false">설정</button>
  </nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ---------- helpers ---------- */
const BUILD='share build 0924-1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r4=n=>Math.round((+n||0)*1e4)/1e4;
const fq=n=>r4(n).toLocaleString('en-US',{maximumFractionDigits:4});
const fmt$c=n=>'$'+(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt$=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const dstr=t=>new Date(t).toLocaleDateString('ko-KR',{month:'long',day:'numeric'});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function showErr(msg){const b=$('errBox');b.classList.remove('hidden');b.textContent='오류: '+msg+' ('+BUILD+')';}
window.addEventListener('error',e=>showErr((e.message||'unknown')+(e.lineno?' @'+e.lineno:'')));
window.addEventListener('unhandledrejection',e=>showErr('promise: '+((e.reason&&(e.reason.code||e.reason.message))||e.reason)));
function setSync(m){$('syncState').textContent=m;}
function relTime(d){const m=Math.round((Date.now()-d)/60000);if(m<1)return '방금';if(m<60)return m+'분 전';const h=Math.round(m/60);if(h<24)return h+'시간 전';return Math.round(h/24)+'일 전';}

/* ---------- state ---------- */
const CODE=decodeURIComponent((location.hash||'').slice(1)).trim();
const LS='mzbShare:'+CODE;
const blankU=()=>({amount:0,holdings:{},done:{},lastP:{},dec:2,appliedAt:0,updatedAt:0,sort:'t'});
let U=blankU();
try{const v=JSON.parse(localStorage.getItem(LS));if(v)U=Object.assign(blankU(),v);}catch(e){}
['holdings','done','lastP'].forEach(k=>{U[k]=U[k]||{};});
let SH=null;          // shared list
let user=null, FA=null, uRef=null, phase='loading', editAmt=false, tab='trade';
const rq=n=>{const k=10**(U.dec??2);return Math.round((+n||0)*k)/k;};
function tsort(){let t=U.sort;if(!t||typeof t!=='object')t={k:typeof t==='string'?t:'t',d:1};return t;}
const LSC='mzbShare:cols';
const COL_DEF={desk:{id:200,amt:104,wt:62},mob:{id:80,amt:66,wt:40}};
let COLS={};try{COLS=JSON.parse(localStorage.getItem(LSC))||{};}catch(e){}
const isMob=()=>matchMedia('(max-width:480px)').matches;
function colW(){const m=isMob()?'mob':'desk';COLS[m]=COLS[m]||{};return COLS[m];}
function saveCols(){try{localStorage.setItem(LSC,JSON.stringify(COLS));}catch(e){}}
function applyCols(){
  const m=isMob()?'mob':'desk', w=Object.assign({},COL_DEF[m],colW());
  document.querySelectorAll('.list').forEach(l=>{l.style.setProperty('--c-id',w.id+'px');l.style.setProperty('--c-amt',w.amt+'px');l.style.setProperty('--c-wt',w.wt+'px');});
}
function bindTable(){
  document.querySelectorAll('[data-hk]').forEach(b=>b.onclick=()=>{
    const cur=tsort(),k=b.dataset.hk;
    U.sort=cur.k===k?{k,d:-cur.d}:{k,d:k==='t'?1:-1};saveU();render();
  });
  document.querySelectorAll('[data-rz]').forEach(h=>h.onpointerdown=e=>{
    e.preventDefault();e.stopPropagation();
    const c=h.dataset.rz, cell=h.parentElement, x0=e.clientX, w0=cell.getBoundingClientRect().width;
    const min={id:56,amt:52,wt:34}[c];
    h.setPointerCapture(e.pointerId);h.classList.add('on');document.body.classList.add('resizing');
    const mv=ev=>{colW()[c]=Math.max(min,Math.round(w0+ev.clientX-x0));applyCols();};
    const up=()=>{h.releasePointerCapture(e.pointerId);h.classList.remove('on');document.body.classList.remove('resizing');
      h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);saveCols();};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
    h.ondblclick=()=>{delete colW()[c];applyCols();saveCols();};
  });
  applyCols();
}
function posHead(){
  const {k,d}=tsort();
  const hs=(key,label)=>`<button class="hs" data-hk="${key}"${k===key?` aria-sort="${d>0?'ascending':'descending'}"`:''}>${label}<span class="arr">${k===key?(d>0?'▲':'▼'):'▲▼'}</span></button>`;
  const rz=c=>`<span class="rz" data-rz="${c}" title="드래그해서 칸 너비 조절"></span>`;
  return `<div class="pos head"><div></div><div class="id">${hs('t','종목')}${rz('id')}</div><div class="amt r">${hs('a','<span class="lg">배분 </span>금액')}${rz('amt')}</div><div class="wt r">${hs('w','비중')}${rz('wt')}</div><div class="r">${hs('tg','주식 수')}</div><div></div></div>`;
}
function saveU(){
  U.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(U));}catch(e){}
  if(FA&&uRef)FA.D.set(uRef,JSON.parse(JSON.stringify(U))).catch(()=>setSync('동기화 오류'));
}

/* ---------- compute ---------- */
function items(){return (SH&&Array.isArray(SH.items))?SH.items.filter(Boolean):[];}
function rows(){
  const it=items(), map={};
  it.forEach(x=>{map[x.t]=x;});
  const ts=new Set([...it.map(x=>x.t),...Object.keys(U.holdings)]);
  const out=[];
  ts.forEach(t=>{
    const x=map[t], cur=r4(U.holdings[t]||0);
    const p=x&&x.p?+x.p:(U.lastP[t]||null);
    const tgAmt=x?U.amount*(+x.w||0)/100:0;
    const tg=x?(p?rq(tgAmt/p):null):0;
    const d=tg==null?null:rq(tg-cur);
    const kind=d==null?'na':d===0?'same':d>0?'buy':'sell';
    const tag=!x&&cur>0?'out':(x&&cur===0&&tg>0?'new':'');
    out.push({t,name:x?x.name||'':'',w:x&&x.w!=null?Math.round(+x.w*10)/10:null,p,tgAmt:x?tgAmt:null,cur,tg,d,kind,tag});
  });
  const g=r=>r.kind==='sell'?0:r.kind==='buy'?1:2;
  const {k,d}=tsort();
  const num=(x,y)=>(x==null&&y==null)?0:x==null?1:y==null?-1:(x-y)*d;
  return out.sort((a,b)=>{
    if(k==='act')return g(a)-g(b)||Math.abs(b.d||0)*(b.p||1)-Math.abs(a.d||0)*(a.p||1)||a.t.localeCompare(b.t);
    if(k==='a')return num(a.tgAmt,b.tgAmt)||a.t.localeCompare(b.t);
    if(k==='w')return num(a.w,b.w)||a.t.localeCompare(b.t);
    if(k==='tg')return num(a.tg,b.tg)||a.t.localeCompare(b.t);
    return a.t.localeCompare(b.t)*d;
  });
}

/* ---------- render ---------- */
function render(){
  const v=$('view');
  $('tabs').classList.toggle('hidden',phase!=='main');
  if(phase==='nocode'){v.innerHTML=`<div class="empty"><p>주소가 올바르지 않습니다. 받은 링크를 그대로 열어 주세요.</p></div>`;return;}
  if(phase==='loading'){v.innerHTML=`<div class="empty"><p>불러오는 중…</p></div>`;return;}
  if(phase==='fail'){v.innerHTML=`<div class="empty"><p>연결하지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`;return;}
  if(phase==='login'){
    v.innerHTML=`<div class="card"><h2>로그인이 필요합니다</h2><p class="help">Google 계정으로 로그인하면 투자금과 보유 수량이 저장되어, 다른 컴퓨터나 폰에서도 그대로 이어서 볼 수 있습니다. 내 정보는 나만 볼 수 있습니다.</p><button class="btn primary" id="btnLogin">Google로 로그인</button></div>`;
    $('btnLogin').onclick=login;return;
  }
  if(!SH){v.innerHTML=`<div class="empty"><p>아직 공유된 리스트가 없거나 링크가 만료됐습니다. 리스트를 보낸 사람에게 새 링크를 요청하세요.</p></div>`;return;}
  if(phase==='main'&&tab==='set'){renderSet(v);return;}
  if(phase==='main'&&tab==='hold'){renderHold(v);return;}
  const listInfo=`<div class="summary"><p class="headline">${dstr(SH.listDate||SH.publishedAt)} 리스트, ${items().length}종목</p>
    <p class="meta">가격은 ${dstr(SH.publishedAt)} 기준 참고 가격이라 실제 체결가와 다를 수 있습니다. 주문은 주식 수 기준으로 하세요.</p></div>`;
  if(!U.amount||editAmt){
    v.innerHTML=listInfo+`<div class="card"><h2>${U.amount?'투자금 수정':'투자금을 입력하세요'}</h2>
      <p class="help">이 리스트를 따라갈 총 금액(달러)입니다. 한 번 넣으면 저장되고, 필요할 때 언제든 바꿀 수 있습니다.</p>
      <div style="display:flex;gap:8px;align-items:center"><span style="font-size:20px;font-weight:700">$</span>
      <input id="amtIn" class="num" inputmode="decimal" style="font-size:20px;font-weight:700;max-width:220px" value="${U.amount||''}" placeholder="10000"></div>
      <div class="row-actions" style="margin-top:12px"><button class="btn primary" id="btnAmt">저장</button>${U.amount?'<button class="btn" id="btnAmtCancel">취소</button>':''}</div></div>`;
    $('btnAmt').onclick=()=>{const a=parseFloat(String($('amtIn').value).replace(/[$,\s]/g,''));if(!(a>0)){toast('금액을 확인해 주세요');return;}U.amount=Math.round(a*100)/100;editAmt=false;saveU();render();};
    if($('btnAmtCancel'))$('btnAmtCancel').onclick=()=>{editAmt=false;render();};
    $('amtIn').focus();return;
  }
  const R=rows(), buys=R.filter(r=>r.kind==='buy'), sells=R.filter(r=>r.kind==='sell');
  const acts=[...buys,...sells], nDone=acts.filter(r=>U.done[r.t]).length;
  const sl=sells.reduce((s,r)=>s-r.d*(r.p||0),0), bu=buys.reduce((s,r)=>s+r.d*(r.p||0),0);
  const fresh=SH.publishedAt>(U.appliedAt||0)&&Object.keys(U.holdings).length>0;
  let h='';
  if(fresh&&acts.length)h+=`<div class="notice">새 리스트가 올라왔습니다 (${dstr(SH.publishedAt)}). 아래 매수·매도대로 조정한 뒤 맨 아래 버튼을 눌러 주세요.</div>`;
  h+=listInfo.replace('</div>',`</div>`);
  h+=`<div class="summary"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <div><div class="meta" style="margin:0">내 투자금</div><div class="num" style="font-size:26px;font-weight:700">${fmt$c(U.amount)}</div></div>
      <button class="btn small" id="btnEditAmt">금액 수정</button></div>
    <p class="headline" style="margin-top:12px">${acts.length?`매수 ${buys.length}종목, 매도 ${sells.length}종목`:(Object.keys(U.holdings).length?'모든 종목이 일치합니다':'')}</p>
    ${acts.length?`<p class="meta">완료 ${nDone}/${acts.length}</p><div class="money num"><div>매도 대금<strong>${fmt$(sl)}</strong></div><div>매수 필요<strong>${fmt$(bu)}</strong></div><div>현금 변화<strong style="color:var(${sl-bu>=0?'--buy':'--sell'})">${sl-bu>=0?'+':''}${fmt$(sl-bu)}</strong></div></div>`:''}</div>`;
  h+=`<div class="sortbar"><button id="btnSort" aria-pressed="${tsort().k==='act'}">매매할 종목 먼저 보기</button></div>`;
  h+=`<div class="list">`+posHead();
  R.forEach((r,i)=>{
    const act=r.kind==='buy'||r.kind==='sell', done=!!U.done[r.t];
    const tag=r.tag==='new'?'<span class="tag new">신규</span>':r.tag==='out'?'<span class="tag out">편출</span>':'';
    const actLine=r.kind==='na'?'<div class="act ok">가격 없음</div>':act?`<div class="act ${r.kind}">${r.d>0?'+':'−'}${fq(Math.abs(r.d))} <small>${r.kind==='buy'?'매수':'매도'}</small></div>`:`<div class="act ok">✓ 일치</div>`;
    h+=`<div class="pos ${act&&done?'done':''} ${act?'':'same'}">
      <div class="no num">${i+1}</div>
      <div class="id"><div><span class="tk">${esc(r.t)}</span>${tag}</div>${(r.name||r.p)?`<div class="nm">${esc(r.name)}${r.p?`${r.name?' ':''}<span class="num">${fmt$c(r.p)}</span>`:''}</div>`:''}</div>
      <div class="amt num">${r.tgAmt!=null?fmt$c(r.tgAmt):''}</div>
      <div class="wt num">${r.w!=null?r.w+'%':''}</div>
      <div class="tgt num"><div class="sh"><b>${r.tg==null?'—':fq(r.tg)}</b><span>주</span></div><div class="hold">보유 ${fq(r.cur)}</div>${actLine}</div>
      <div class="ck">${act?`<button class="check" data-done="${esc(r.t)}" aria-pressed="${done}" aria-label="${esc(r.t)} 완료">✓</button>`:''}</div></div>`;
  });
  h+=`</div>`;
  if(acts.length||!Object.keys(U.holdings).length)h+=`<div class="apply-bar"><button class="btn primary" id="btnApply">${Object.keys(U.holdings).length?'매매 끝 — 보유 수량 갱신':'매수 끝 — 보유로 저장'}</button></div>`;
  v.innerHTML=h;
  $('btnEditAmt').onclick=()=>{editAmt=true;render();};
  $('btnSort').onclick=()=>{U.sort=tsort().k==='act'?{k:'t',d:1}:{k:'act',d:1};saveU();render();};
  v.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const t=b.dataset.done;if(U.done[t])delete U.done[t];else U.done[t]=true;saveU();render();});
  if($('btnApply'))$('btnApply').onclick=apply;
  bindTable();
}
function apply(){
  const R=rows(), acts=R.filter(r=>r.kind==='buy'||r.kind==='sell');
  const pending=acts.filter(r=>!U.done[r.t]).length;
  if(pending&&!confirm(`아직 체크 안 한 종목이 ${pending}개 있습니다. 그래도 목표 수량대로 보유를 갱신할까요?`))return;
  const nh={};R.forEach(r=>{if(r.tg&&r.tg>0)nh[r.t]=r.tg;else if(r.kind==='na'&&r.cur>0)nh[r.t]=r.cur;});
  const lp={};items().forEach(x=>{if(x.p)lp[x.t]=+x.p;});U.lastP=lp;
  U.holdings=nh;U.done={};U.appliedAt=SH.publishedAt;saveU();render();toast('보유 수량을 갱신했습니다');window.scrollTo(0,0);
}
function renderHold(v){
  const ts=Object.keys(U.holdings).sort();
  v.innerHTML=`<div class="card"><h2>내 보유 수량</h2><p class="help">실제 계좌와 다르면 여기서 고치세요. 매매 후 조정 화면에서 갱신 버튼을 누르면 자동으로 바뀝니다.</p>
    <div class="row-actions"><button class="btn small" id="btnAddH">종목 추가</button></div></div>
    <div class="tbl"><table><thead><tr><th class="no"></th><th>종목</th><th style="text-align:right">보유 수량</th><th></th></tr></thead><tbody>
    ${ts.length?ts.map((t,i)=>`<tr><td class="no">${i+1}</td><td><span class="tk" style="font-size:15px">${esc(t)}</span></td><td style="text-align:right"><input class="q num" type="number" inputmode="decimal" step="any" min="0" value="${U.holdings[t]}" data-h="${esc(t)}"></td><td class="x"><button class="xbtn" data-dh="${esc(t)}" aria-label="삭제">×</button></td></tr>`).join(''):`<tr><td colspan="4" style="color:var(--muted);padding:16px 10px">아직 보유가 없습니다.</td></tr>`}
    </tbody></table></div>`;
  v.querySelectorAll('[data-h]').forEach(i=>i.onchange=()=>{U.holdings[i.dataset.h]=Math.max(0,r4(parseFloat(i.value)||0));saveU();});
  v.querySelectorAll('[data-dh]').forEach(b=>b.onclick=()=>{delete U.holdings[b.dataset.dh];saveU();render();});
  $('btnAddH').onclick=()=>{const t=String(prompt('티커를 입력하세요 (예: AAPL)')||'').toUpperCase().replace(/[^A-Z0-9.\-]/g,'');if(!t)return;if(!(t in U.holdings))U.holdings[t]=0;saveU();render();};
}
function renderSet(v){
  v.innerHTML=`<div class="card"><h2>투자금</h2><p class="help">현재 ${fmt$c(U.amount||0)}</p><button class="btn small" id="btnAmt2">금액 수정</button></div>
    <div class="card"><h2>거래 단위</h2><p class="help">증권사에서 주문 가능한 소수 자릿수입니다. 목표 주식 수를 이 자리에서 반올림합니다.</p>
      <select id="decSel" style="font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px">
      ${[0,1,2,3,4].map(d=>`<option value="${d}" ${U.dec===d?'selected':''}>${d?d+'자리 (0.'+'0'.repeat(d-1)+'1주)':'정수만 (1주)'}</option>`).join('')}</select></div>
    <div class="card"><h2>계정</h2><p class="help">${esc(user&&user.email||'')}으로 로그인됨</p><button class="btn small" id="btnOut">로그아웃</button></div>`;
  $('btnAmt2').onclick=()=>{editAmt=true;tab='trade';selTab();render();};
  $('decSel').onchange=()=>{U.dec=+$('decSel').value;saveU();toast('거래 단위를 바꿨습니다');};
  $('btnOut').onclick=async()=>{if(confirm('로그아웃할까요?'))await FA.U.signOut(FA.auth);};
}
function selTab(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selTab();render();window.scrollTo(0,0);});

const FB_CFG={apiKey:"AIzaSyDuPNWBsNtT9ZzcqMKAut-C5PYtMk7vF-M",authDomain:"mzbrecalculate.firebaseapp.com",databaseURL:"https://mzbrecalculate-default-rtdb.firebaseio.com",projectId:"mzbrecalculate",storageBucket:"mzbrecalculate.firebasestorage.app",messagingSenderId:"946213449992",appId:"1:946213449992:web:95c5e46858533a8b187cbd"};
const FBV='10.12.2';
let unsubU=null;
async function init(){
  if(!CODE){phase='nocode';render();return;}
  render();
  try{
    const base=`https://www.gstatic.com/firebasejs/${FBV}/`;
    const [A,Au,D]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
    const app=A.initializeApp(FB_CFG);
    let auth;try{auth=Au.initializeAuth(app,{persistence:[Au.indexedDBLocalPersistence,Au.browserLocalPersistence],popupRedirectResolver:Au.browserPopupRedirectResolver});}catch(e){auth=Au.getAuth(app);}
    const db=D.getDatabase(app);
    FA={U:Au,D,auth,db};
    Au.getRedirectResult(auth).catch(()=>{});
    Au.onAuthStateChanged(auth,u=>{
      user=u;
      if(unsubU){unsubU();unsubU=null;}
      if(!u){uRef=null;phase='login';setSync('');render();return;}
      setSync('연결 중…');
      D.onValue(D.ref(db,'share/'+CODE),snap=>{SH=snap.val();if(phase!=='main'){phase='main';selTab();}render();},err=>{SH=null;phase='main';render();});
      uRef=D.ref(db,`users/${u.uid}/follow/${CODE}`);
      unsubU=D.onValue(uRef,snap=>{
        const r=snap.val();
        if(!r){if(U.updatedAt)saveU();}
        else if((r.updatedAt||0)>(U.updatedAt||0)){U=Object.assign(blankU(),r);['holdings','done','lastP'].forEach(k=>{U[k]=U[k]||{};});try{localStorage.setItem(LS,JSON.stringify(U));}catch(e){}render();}
        else if((r.updatedAt||0)<(U.updatedAt||0))saveU();
        setSync('동기화됨');
      },()=>setSync('동기화 오류'));
    });
  }catch(e){phase='fail';render();showErr((e&&(e.code||e.message))||e);}
}
async function login(){
  if(!FA)return;
  try{history.replaceState(null,'',location.origin+location.pathname+location.hash);}catch(e){}
  const p=new FA.U.GoogleAuthProvider();
  try{await FA.U.signInWithPopup(FA.auth,p);}
  catch(e){if(/popup-blocked|operation-not-supported|cancelled-popup/.test(e.code||''))FA.U.signInWithRedirect(FA.auth,p);else if(!/popup-closed/.test(e.code||''))toast('로그인하지 못했습니다: '+(e.code||''));}
}
async function loadVersion(){
  const host=location.hostname;if(!host.endsWith('.github.io'))return;
  const owner=host.split('.')[0], repo=location.pathname.split('/').filter(Boolean)[0];
  try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=share.html&per_page=1`,{cache:'no-store'});if(!r.ok)return;
    const c=(await r.json())[0];if(!c)return;const msg=c.commit.message.split('\n')[0].trim();const m=msg.match(/\bv\s?(\d+(?:\.\d+)*)\s*$/i);
    $('verTag').innerHTML=`${esc(m?'V'+m[1]:msg.replace(/^Update\s+/i,''))}<small>${relTime(new Date(c.commit.committer.date))}</small>`;}catch(e){}
}
window.addEventListener('hashchange',()=>location.reload());
$('buildTag').textContent=BUILD;
loadVersion();
init();
</script>
